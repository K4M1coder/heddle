[package]
name = "heddle-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
heddle-core = { path = "../heddle-core" }
# `server` + `macros` are product dependencies *here* and dev-dependencies in
# `heddle-mcp`, which is the whole reason this crate exists rather than the
# server living there: that crate's rmcp features are deliberately client-only.
heddle-mcp = { path = "../heddle-mcp" }
rmcp = { workspace = true, features = ["server", "macros", "transport-async-rw"] }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util"] }
schemars.workspace = true
serde.workspace = true
# `src/git.rs` is the only module in the workspace that names either of these.
# That boundary is deliberate: `gix` was rejected on footprint rather than
# quality, and if that footprint ever stops mattering the swap touches one file.
git2.workspace = true
chrono.workspace = true
# `src/fs.rs` is the only module in the workspace that may name this — the same
# boundary `git2` above and `heddle-sandbox` below get, and here it is the point
# of the type: no `cap_std` type appears in any public signature outside
# `FsRoot`, so `heddle-core` and every `ToolTransport` stay unaware of it.
cap-std.workspace = true
# `src/run.rs` is the only module that names this, and it is the only crate in
# the workspace containing `unsafe` — the same boundary discipline `git2` above
# gets, for a much stronger reason. Declared unconditionally because the crate
# compiles on all three OSes: off Windows its `Sandbox` is uninhabited and
# `Sandbox::create` is a loud refusal, which is exactly what
# `EmbeddedServer::with_run` needs in order to fail there rather than serve a
# silently missing tool.
heddle-sandbox = { path = "../heddle-sandbox" }
# `src/atlassian/` is the only module in the workspace that names either of
# these, and the boundary is the same one `git2` and `cap-std` above get.
#
# No default features, deliberately, and the reason is `heddle-gateway`'s
# verbatim: `default = ["rustls", "gzip"]` would compile a TLS backend in, and
# without one an `https://` endpoint is unreachable at the transport
# (`ureq::Error::TlsRequired`). The two crates' TLS posture must move together
# or not at all — Cargo unifies features across the graph, so enabling a
# backend here would silently give `heddle-gateway`'s cloud-provider path real
# HTTPS too and retire spec 012 SC-007 for the shipped binary. Do not relax
# this in one crate.
ureq = { workspace = true }
# Parsing only: the `--atlassian-base-url` an operator names, checked before a
# socket exists, exactly as `LocalEndpoint::parse` checks a provider's.
http.workspace = true
# Jira and Confluence speak JSON, so this is a product dependency here and not
# only a test one.
serde_json.workspace = true

[dev-dependencies]
# The headline acceptance test needs the model client, the loop and the
# connector visible at once, and this is the only crate that can see all three.
# Product code must not depend on `heddle-gateway`: a connector has no business
# knowing a model provider exists.
heddle-gateway = { path = "../heddle-gateway" }
tempfile.workspace = true
# Declared again here because an integration test in `tests/` links against the
# crate as an external dependency and does not inherit its product dependencies.
# The git fixtures build real repositories with real commits through `git2`
# rather than shelling out to a `git` binary: no `PATH` assumption, and
# deterministic on all three OSes.
git2.workspace = true
# Declared again for the reason directly above: `tests/run_server.rs` names
# `ARG_COUNT_CAP`, which is the launcher's cap and not this crate's.
heddle-sandbox = { path = "../heddle-sandbox" }
# Only `tests/governed_proc_run.rs`'s `#[ignore]`d live test names this, and
# only to persist a hand-verification's chain to a real silo when
# $HEDDLE_LIVE_SILO_ROOT is set — so `heddle ledger show` can read the evidence
# back in a second process. `cargo test --workspace` stays hermetic and offline:
# without that variable the test falls back to an in-memory `Ledger`.
heddle-silo = { path = "../heddle-silo" }
