[package]
name = "skein-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# No `lib` target: the CLI is the outermost layer and nothing may depend on it
# (Constitution IV).
[[bin]]
name = "skein"
path = "src/main.rs"

[dependencies]
skein-core = { path = "../skein-core" }
skein-silo = { path = "../skein-silo" }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
