[package]
name = "skein-sandbox"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The deterministic AppContainer profile name is the first 16 hex characters of
# `sha256(canonical root path)`, so repeated runs over one root reuse one
# profile and one ACE. Already a workspace dependency, and needed on every OS
# because the name is derived before any platform-specific call.
sha2.workspace = true

# Neither of these appears in any other crate's graph, and neither is compiled
# on Linux or macOS at all.
[target.'cfg(windows)'.dependencies]
windows.workspace = true
win32job.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# `CommandLineToArgvW` is the **real Win32 parser** the argv quoting test uses
# as its oracle, instead of a hand-written mirror of the MSVCRT rules. It is
# needed by tests only, so the feature stays out of the product dependency.
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_Storage_FileSystem"] }
