[package]
name = "heddle-ui"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A `lib` target as well as the `bin`, and the split is the design: `session`
# holds every line worth testing and knows nothing about Tauri, so
# `tests/chat_session.rs` can drive it against the real `heddle` binary with no
# window and no `AppHandle`. Nothing in the product depends on this crate, so
# the lib target does not weaken Constitution IV.
[lib]
name = "heddle_ui"
path = "src/lib.rs"

[[bin]]
name = "heddle-ui"
path = "src/main.rs"

[dependencies]
# The client role of the same protocol crate `heddle-acp` serves the agent role
# of. This shell is an ACP *client*: it sends what an editor would send.
agent-client-protocol.workspace = true
futures.workspace = true
serde.workspace = true
tauri.workspace = true

# The one crate under `crates/` this shell depends on, and slice 036's
# "`ui/src-tauri` depends on no crate under `crates/`" is narrowed by it rather
# than quietly dropped. The Code view has to decide whether a path an operator
# clicked is inside the session's `--fs-root`, and that decision already exists:
# `FsRoot` is the handle-relative containment primitive the CLI's own `fs_read`
# and `fs_list` tools resolve every model-supplied path through. Reimplementing
# it here would be a second, untested copy of the one rule in the product that a
# string cannot express (Constitution VII: reuse over reinvention), so the
# dependency is taken on `heddle-connectors` and on nothing else. It carries no
# loop, no chain, no silo and no model, so it cannot become a place for agent
# logic to hide — which is the property Constitution I and IV were protecting.
heddle-connectors = { path = "../../crates/heddle-connectors" }

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
# `tests/settings_command.rs` makes a **real** repository rather than asserting
# against a boolean it set itself: the Settings screen's git row is whatever
# `heddle_connectors::is_git_repository` says after walking the directory, so
# the fixture has to be a directory that walk really succeeds on.
git2.workspace = true
serde_json.workspace = true
tempfile.workspace = true
