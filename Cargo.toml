[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
thiserror = "1"
sha2 = "0.10"
rmcp = { version = "2.2" }
tokio = { version = "1" }
schemars = "1"
agent-client-protocol = "2.0.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
tokio-util = "0.7"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# `default-features = false` is the point, not tidiness: git2 0.21's `default`
# is empty, so with `https` and `ssh` left off **no network transport is
# compiled in at all** — no `openssl-sys`, no `libssh2-sys` in the tree. That is
# the same build-property guarantee `skein-gateway` makes about TLS
# (Constitution II, NON-NEGOTIABLE), now applied to git. `vendored-libgit2`
# pins one libgit2 on all three OSes instead of linking whatever a runner has,
# mirroring `rusqlite`'s `bundled` above.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The one containment primitive in the product that a string cannot express:
# a directory handle, and opens resolved relative to it. Windows has no
# `openat`, so a genuine handle-relative open needs `NtCreateFile` with
# `OBJECT_ATTRIBUTES.RootDirectory` — the `Wdk_*` layer of `windows-sys`, below
# the Win32 layer `skein-sandbox` uses. This crate is the Bytecode Alliance's,
# it is the filesystem sandbox underneath Wasmtime's WASI, and it clears every
# criterion ADR-0006 used to reject `rappct` (~5,400 all-time downloads, single
# maintainer, pre-1.0) by orders of magnitude: ~18.9M all-time downloads, an
# organization behind it, 4.0.3, and a filed-and-fixed RustSec advisory
# (RUSTSEC-2024-0445) proving the process exists.
#
# **The cost, measured and accepted rather than glossed:** 16 new packages on
# the Windows product tree, of which three are duplicate `windows-sys` majors
# (0.59 via `fs-set-times`/`winx`, 0.60 via `io-extras`) on top of the 0.61
# pinned above, plus two duplicate `windows-targets` pairs — directly against
# that pin's own "one copy of a very large generated crate beats two". Accepted
# because this is `windows`'s and `win32job`'s shape and not `gix`'s: those two
# were taken, large, as the only way to get a **security property** the product
# had claimed, where `gix` was refused as a convenience over a working `git2`.
# `default-features = false` for `git2`'s recorded reason — `default` is already
# empty here, and stating it is this workspace's house style.
cap-std = { version = "4", default-features = false }
tempfile = "3"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
keyring-core = "1"
windows-native-keyring-store = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
linux-keyutils-keyring-store = "1"
ureq = { version = "3", default-features = false }
http = "1"
# Pinned to 0.61 and not the newer 0.62 on purpose: `win32job` below depends on
# `windows ^0.61`, and one copy of a very large generated crate in the tree
# beats two. Nothing `skein-sandbox` calls is 0.62-only, and `assign_process`
# takes an `isize` rather than a `HANDLE`, so even a future split would not be
# a type-safety problem — the pin is about footprint, the same discipline that
# produced `git2`'s and `ureq`'s `default-features = false`.
#
# Both entries appear **only** in `[target.'cfg(windows)'.dependencies]` of
# `skein-sandbox`, so `cargo tree` on Linux and macOS shows neither at all.
windows = { version = "0.61", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Pipes",
] }
win32job = "2.0"
