[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
rmcp = { version = "2.2" }
tokio = { version = "1" }
schemars = "1"
agent-client-protocol = "2.0.0"
tokio-util = "0.7"
