[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
thiserror = "1"
sha2 = "0.10"
rmcp = { version = "2.2" }
tokio = { version = "1" }
schemars = "1"
agent-client-protocol = "2.0.0"
tokio-util = "0.7"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tempfile = "3"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
keyring-core = "1"
windows-native-keyring-store = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
linux-keyutils-keyring-store = "1"
ureq = { version = "3", default-features = false }
http = "1"
