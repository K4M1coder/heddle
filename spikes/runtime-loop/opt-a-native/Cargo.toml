[package]
name = "opt-a-native"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"

[dev-dependencies]
wiremock = "0.6"
